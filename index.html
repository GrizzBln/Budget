<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E0B09">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#0E0B09; --bg2:#16110D; --card:#1C1611; --card2:#241C15; --line:#33281F;
  --text:#FFF4EA; --muted:#B5A595; --faint:#7D6E61;
  --orange:#FF7A1A; --orange2:#FF9A3D; --deep:#E5520A;
  --fix:#F26B0F; --save:#4F8CFF; --free:#2BB585; --danger:#FF5A5F;
  --r:22px; --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Hintergrund-Glühen */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glow::before,.glow::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--glow-op)}
.glow::before{width:420px;height:420px;background:radial-gradient(circle,var(--glow1) 0%,transparent 70%);top:-180px;right:-140px;animation:drift 18s ease-in-out infinite alternate}
.glow::after{width:360px;height:360px;background:radial-gradient(circle,var(--glow2) 0%,transparent 70%);bottom:-160px;left:-160px;opacity:.35;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-40px,60px) scale(1.15)}}

/* ---------- Sperrbildschirm ---------- */
#lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(var(--safe-t) + 20px) 24px calc(var(--safe-b) + 20px);background:radial-gradient(120% 80% at 50% 0%,var(--lockglow) 0%,var(--bg) 60%)}
.logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(145deg,var(--orange2),var(--deep));display:grid;place-items:center;box-shadow:0 20px 50px -10px rgba(var(--acc-rgb),.6),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:50px;height:50px}
#lock h1{margin:6px 0 0;font-size:28px;letter-spacing:-.5px}
#lockMsg{color:var(--muted);font-size:15px;min-height:20px;text-align:center}
.dots{display:flex;gap:14px;margin:8px 0 14px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--orange);transition:.15s}
.dot.on{background:var(--orange);box-shadow:0 0 12px var(--orange)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.key{height:76px;border-radius:50%;background:var(--key);font-size:30px;font-weight:500;transition:background .1s,transform .1s;backdrop-filter:blur(10px)}
.key:active{background:rgba(var(--acc-rgb),.35);transform:scale(.94)}
.key.ghost{background:none;font-size:17px;color:var(--muted)}
.lock-note{color:var(--faint);font-size:12px;text-align:center;max-width:290px;line-height:1.4}

/* ---------- App ---------- */
#app{position:relative;z-index:1;padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + 110px);max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.hello{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.title{font-size:30px;font-weight:700;letter-spacing:-.8px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.view{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h3 small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:13px}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--hero);border:0;color:var(--hero-ink);padding:22px 20px 20px;box-shadow:0 24px 60px -20px rgba(var(--acc-rgb),.65)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.09)}
.hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.hero .big{font-size:48px;font-weight:800;letter-spacing:-1.5px;margin:4px 0 2px;line-height:1.05}
.hero .sub{font-size:14px;opacity:.9}
.hero .row{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.pill{background:rgba(0,0,0,.18);backdrop-filter:blur(6px);border-radius:14px;padding:8px 12px;flex:1;min-width:92px}
.pill b{display:block;font-size:16px}
.pill span{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.8px;font-weight:600}

/* Ring */
.ringwrap{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .center b{font-size:26px;font-weight:800;letter-spacing:-1px;display:block}
.ring .center span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.seg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg .v{margin-left:auto;font-weight:700}
.lg .p{color:var(--faint);font-size:12px;width:32px;text-align:right;flex:none}

/* Balken */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .bt{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:8px}
.bar .bt span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt b{font-weight:700;white-space:nowrap}
.bar .bt em{font-style:normal;color:var(--faint);font-size:12px;margin-left:6px}
.track{height:10px;background:var(--track);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--deep),var(--orange2));width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar{cursor:pointer}

/* Listen */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{opacity:.6}
.emo{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none;border:1px solid var(--line)}
.item .meta{flex:1;min-width:0}
.item .n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);margin-top:2px}
.item .a{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.item .a small{display:block;color:var(--faint);font-weight:500;font-size:12px}
.due{font-size:12px;font-weight:700;padding:4px 9px;border-radius:10px;background:rgba(var(--acc-rgb),.14);color:var(--orange2);white-space:nowrap}
.due.today{background:var(--orange);color:var(--on-acc)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:15px;line-height:1.5}
.empty .e{font-size:40px;display:block;margin-bottom:6px}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;margin-top:6px;border-radius:14px;border:1.5px dashed var(--line2);color:var(--orange2);font-weight:700;font-size:15px}
.grouphead{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.grouphead .gn{font-weight:700;font-size:17px}
.grouphead .gt{margin-left:auto;font-weight:700;color:var(--orange2)}
.grouphead .gp{color:var(--faint);font-size:13px}

.seg-ctl{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg-ctl button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg-ctl button.on{background:var(--orange);color:var(--on-acc)}

/* Tabbar */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 12px);z-index:5;display:flex;gap:2px;padding:6px;max-width:calc(100vw - 20px);border-radius:26px;background:var(--tabbar);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.07);box-shadow:0 16px 40px rgba(0,0,0,.5)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:19px;font-size:10.5px;font-weight:700;color:var(--faint);min-width:62px;transition:.2s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--on-acc);background:linear-gradient(145deg,var(--orange2),var(--orange))}
.fab{width:54px;height:54px;flex:none;border-radius:19px;background:linear-gradient(145deg,var(--orange2),var(--deep));color:var(--on-btn);display:grid;place-items:center;box-shadow:0 10px 26px -6px rgba(var(--acc-rgb),.8);align-self:center;margin:0 2px}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.92)}

/* Sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(var(--safe-b) + 22px);transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s .32s;max-height:92vh;overflow-y:auto}
#sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
#sheet h2{margin:0 0 16px;font-size:22px;letter-spacing:-.4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border .15s;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--orange)}
.amount{font-size:34px!important;font-weight:800;text-align:center;letter-spacing:-1px;padding:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:rgba(var(--acc-rgb),.18);border-color:var(--orange);color:var(--orange2)}
.btn{width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:17px;background:linear-gradient(145deg,var(--orange2),var(--deep));color:var(--on-btn);margin-top:6px;box-shadow:0 10px 24px -10px rgba(var(--acc-rgb),.8)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.del{background:none;color:var(--danger);box-shadow:none}
.hint{font-size:13px;color:var(--faint);line-height:1.45;margin:4px 0 12px}

/* Einstellungen */
.set{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.set:last-child{border-bottom:0}
.set .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--card2)}
.set .r{margin-left:auto;color:var(--faint);font-size:14px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.ok i{background:var(--free);box-shadow:0 0 8px var(--free)}
.status.err i{background:var(--danger)}

#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-250%);visibility:hidden;z-index:60;background:var(--toastbg);border:1px solid var(--line);padding:11px 18px;border-radius:16px;font-weight:600;font-size:15px;transition:transform .35s cubic-bezier(.2,.9,.25,1);box-shadow:0 12px 30px rgba(0,0,0,.5);white-space:nowrap}
#toast.on{transform:translate(-50%,0);visibility:visible}
.burst{position:fixed;width:10px;height:10px;border-radius:3px;z-index:70;pointer-events:none}

/* ---------- v2 Ergänzungen ---------- */
:root{--loan:#B157E0; --var:#B88A0E; --inc:#8E9AA8}
.hbtns{display:flex;gap:8px}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:14px}
.monthbar button{width:40px;height:36px;border-radius:12px;font-size:20px;color:var(--orange2);font-weight:700}
.monthbar button:active{background:var(--card2)}
.monthbar .ml{font-weight:800;font-size:16px;text-align:center}
.monthbar .ml small{display:block;font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.banner{display:flex;gap:12px;align-items:center;background:rgba(var(--acc-rgb),.1);border:1px solid rgba(var(--acc-rgb),.35);border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.35;cursor:pointer}
.banner .be{font-size:24px}
.banner b{color:var(--orange2)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--muted);margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.5px}
.tag.o{background:rgba(var(--acc-rgb),.18);color:var(--orange2)}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{margin:0;padding:12px;font-size:15px}
.datehead{font-size:12px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.9px;margin:12px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile .te{font-size:26px}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted);line-height:1.3}
.tile.hi{background:linear-gradient(145deg,rgba(var(--acc2-rgb),.22),rgba(var(--deep-rgb),.12));border-color:rgba(var(--acc-rgb),.45)}
.chart svg{width:100%;height:auto;display:block}
.chart .leg{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px}
.chart .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart .mcol{cursor:pointer}
.goal{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.goal:last-child{border-bottom:0}
.gring{width:62px;height:62px;flex:none;position:relative}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring .ge{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.goal .gm{flex:1;min-width:0}
.goal .gn{font-weight:700;font-size:16px}
.goal .gs{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.goal .gp{font-weight:800;font-size:15px;color:var(--orange2);white-space:nowrap}
.mini{font-size:12px;padding:7px 11px;border-radius:11px;background:var(--orange);color:var(--on-acc);font-weight:800}
.loan .lt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.loan .ln{font-weight:700;font-size:17px}
.loan .ll{font-size:13px;color:var(--muted)}
.loan .lb{font-size:24px;font-weight:800;letter-spacing:-.6px;text-align:right}
.loan .lb small{display:block;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.loan .track{margin:12px 0 8px}
.loan .fill{background:linear-gradient(90deg,#7D33A8,var(--loan))}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.kv div{background:var(--card2);border-radius:12px;padding:8px 10px}
.kv span{display:block;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kv b{font-size:14px}
.preview{background:var(--card);border:1px dashed var(--line2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:12px}
.preview b{color:var(--text)}
.prog{height:8px;background:var(--track);border-radius:5px;overflow:hidden;margin:10px 0 4px}
.prog div{height:100%;background:linear-gradient(90deg,var(--deep),var(--orange2));width:0;transition:width .3s}
.ocr-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ocr-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--orange)}
.ocr-row .on{font-weight:600;font-size:15px;background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;width:100%;outline:none}
.ocr-row .on:focus{border-bottom-color:var(--orange)}
.ocr-row .oa{font-weight:800;white-space:nowrap}
.ocr-row .ob{grid-column:2 / 4;display:flex;gap:8px}
.ocr-row select,.ocr-row input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;color:var(--text);-webkit-appearance:none;appearance:none}
.ocr-row select{flex:1;min-width:0}
.ocr-row input[type=date]{width:128px;flex:none;min-width:0}
.ocr-row{overflow:hidden}
.ocr-row.dup{opacity:.5}
.ocr-row.inc .oa{color:var(--free)}
.ocr-thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.ocr-thumbs img{height:90px;border-radius:10px;border:1px solid var(--line)}

/* ---------- v2.1 ---------- */
/* Sperrbildschirm skaliert mit der Displayhöhe (z. B. iPhone Duo Außendisplay) */
#lock{gap:clamp(8px,2.2dvh,18px);overflow-y:auto}
.logo{flex:none;width:clamp(56px,10dvh,84px);height:clamp(56px,10dvh,84px);border-radius:clamp(18px,3.1dvh,26px)}
.logo svg{width:60%;height:60%}
#lock h1{font-size:clamp(22px,3.6dvh,28px);margin:0}
.dots{margin:clamp(2px,1dvh,8px) 0 clamp(6px,1.6dvh,14px)}
.pad{grid-template-columns:repeat(3,clamp(58px,9.4dvh,76px));gap:clamp(10px,1.9dvh,16px)}
.key{height:clamp(58px,9.4dvh,76px);font-size:clamp(24px,3.6dvh,30px)}
@media (max-height:740px){ .lock-note{display:none} }
@media (max-height:600px){ #lock h1{display:none} }

/* Pull-to-Refresh */
#ptr{position:fixed;left:50%;top:calc(var(--safe-t) + 6px);z-index:15;width:44px;height:44px;margin-left:-22px;border-radius:50%;
  background:linear-gradient(145deg,var(--orange2),var(--deep));display:grid;place-items:center;box-shadow:0 8px 22px -6px rgba(var(--acc-rgb),.8);
  transform:translateY(-80px) scale(.6);opacity:0;pointer-events:none;transition:opacity .2s}
#ptr svg{width:24px;height:24px}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}

/* Bringt alte (v1) oder unvollständige Daten auf v2 */
function normalize(o){
  const d = {...emptyData(), ...(o || {})};
  if (!o?.v || o.v < 2){
    const m0 = CUR();
    d.fixed = [...(o?.expenses || []).map(x => ({...x})), ...(o?.savings || []).map(x => ({...x, cat:"sparen"}))]
      .map(x => ({interval:"monthly", ...x, id:x.id || uid(), amount: typeof x.amount === "number" ? x.amount : parseAmt(x.amount), from:x.from || m0, until:null}));
    d.incomes = Array.isArray(o?.incomes) && o.incomes.length ? {[m0]: o.incomes.map(x => ({id:x.id || uid(), name:x.name, amount:monthlyOf({interval:"monthly", ...x})}))} : (o?.incomes && !Array.isArray(o.incomes) ? o.incomes : {});
    delete d.expenses; delete d.savings; d.v = 2;
  }
  for (const k of ["fixed","loans","tx","goals"]) if (!Array.isArray(d[k])) d[k] = [];
  if (!d.incomes || Array.isArray(d.incomes)) d.incomes = {};
  for (const list of Object.values(d.incomes)) (list || []).forEach(x => { if (!x.kind) x.kind = /gehalt|lohn|bezüge|entgelt|salary/i.test(x.name || "") ? "gehalt" : /zins/i.test(x.name || "") ? "zinsen" : "sonstig"; });
  if (!d.rules) d.rules = {};
  if (!d.deleted || typeof d.deleted !== "object") d.deleted = {};
  if (!d.settings) d.settings = {sync:null};
  if (d.settings.sound === undefined) d.settings.sound = true;
  if ((d.settings.soundV || 0) < 3){ if (!d.settings.soundType || d.settings.soundType === "kasching") d.settings.soundType = "katsching"; d.settings.soundV = 3; }
  if (!Array.isArray(d.categories) || !d.categories.length) d.categories = structuredClone(DEFAULT_CATS);
  for (const c of DEFAULT_CATS) if (!d.categories.find(x => x.id === c.id) && ["sparen","sonst","shop","gesund"].includes(c.id)) d.categories.push(structuredClone(c));
  const sp = d.categories.find(c => c.id === "sparen"); if (sp) sp.saving = true;
  return d;
}

/* ---------- Krypto ---------- */
const b64 = buf => { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(secret, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:KDF_ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function sealWith(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj))); return {iv:b64(iv), ct:b64(ct)}; }
async function openWith(key, box){ const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(box.iv)}, key, unb64(box.ct)); return JSON.parse(dec.decode(pt)); }
async function sealPassword(pass, obj){ const salt = crypto.getRandomValues(new Uint8Array(16)); const key = await deriveKey(pass, salt); return {format:"budget-enc", v:2, salt:b64(salt), ...(await sealWith(key, obj))}; }
async function openPassword(pass, box){ return openWith(await deriveKey(pass, unb64(box.salt)), box); }

/* ---------- Zustand ---------- */
let D = null, KEY = null, SALT = null, hiddenAt = 0, syncTimer = null, syncState = {ok:null, msg:"aus"};
let SEL = CUR(), current = "home", fixTab = "fix";
/* Zeitstempel je Eintrag + Löschmarker – Grundlage für das Zusammenführen beim Sync */
let SNAP = new Map();
const COLLS = ["fixed","loans","tx","goals","categories"];
function collect(d){
  const m = new Map();
  for (const c of COLLS) (d[c] || []).forEach(it => m.set(c + ":" + it.id, it));
  for (const [mo, list] of Object.entries(d.incomes || {})) (list || []).forEach(it => m.set("inc:" + mo + ":" + it.id, it));
  return m;
}
const sig = it => JSON.stringify(it, (k, v) => k === "mt" ? undefined : v);
function takeSnap(){ SNAP = new Map([...collect(D)].map(([k, it]) => [k, sig(it)])); }
function stamp(){
  const now = Date.now(), cur = collect(D);
  for (const [k, it] of cur){ const s = sig(it); if (SNAP.get(k) !== s) it.mt = now; }
  for (const k of SNAP.keys()) if (!cur.has(k)) D.deleted[k] = now;
  for (const [k, t] of Object.entries(D.deleted)) if (now - t > 180 * 864e5) delete D.deleted[k];
  takeSnap();
}
async function persist(touch = true){
  if (touch){ stamp(); D.updatedAt = Date.now(); }
  localStorage.setItem(VAULT, JSON.stringify({salt:b64(SALT), ...(await sealWith(KEY, D))}));
  if (touch) scheduleSync();
}

/* ---------- Sperrbildschirm ---------- */
let pinBuf = "", pinMode = "unlock", pinFirst = "";
function buildPad(){
  $("#dots").innerHTML = Array.from({length:PIN_LEN}, () => '<div class="dot"></div>').join("");
  $("#pad").innerHTML = ["1","2","3","4","5","6","7","8","9","bio","0","⌫"].map(k => k === "bio" ? `<button class="key ghost bio hidden" data-k="bio" aria-label="Mit Touch ID / Face ID entsperren">${BIO_ICON}</button>` : `<button class="key ${k==="⌫"?"ghost":""}" data-k="${k}">${k}</button>`).join("");
  $("#pad").onclick = e => { const b = e.target.closest(".key"); if (b) pinKey(b.dataset.k); };
  document.addEventListener("keydown", e => { if ($("#lock").classList.contains("hidden")) return; if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === "Backspace") pinKey("⌫"); });
}
function drawDots(){ [...$("#dots").children].forEach((d,i) => d.classList.toggle("on", i < pinBuf.length)); }
function failPin(msg){ $("#dots").classList.remove("shake"); void $("#dots").offsetWidth; $("#dots").classList.add("shake"); $("#lockMsg").textContent = msg; pinBuf = ""; setTimeout(drawDots, 200); }
async function pinKey(k){
  if (k === "bio") return bioUnlock(true);
  if (k === "⌫"){ pinBuf = pinBuf.slice(0,-1); drawDots(); return; }
  if (pinBuf.length >= PIN_LEN) return;
  pinBuf += k; drawDots();
  if (pinBuf.length < PIN_LEN) return;
  const pin = pinBuf;
  if (pinMode === "setup1"){ pinFirst = pin; pinMode = "setup2"; pinBuf = ""; setTimeout(drawDots,150); $("#lockMsg").textContent = "PIN wiederholen"; return; }
  if (pinMode === "setup2"){
    if (pin !== pinFirst){ pinMode = "setup1"; failPin("Stimmt nicht überein – neue PIN wählen"); return; }
    $("#lockMsg").textContent = "Verschlüssele …";
    SALT = crypto.getRandomValues(new Uint8Array(16)); KEY = await deriveKey(pin, SALT);
    D = normalize(D); takeSnap(); await persist(false); pinBuf = ""; enterApp(true); return;
  }
  if (!(await unlockWith(pin))) failPin("Falsche PIN");
}
async function unlockWith(pin){
  $("#lockMsg").textContent = "Entsperre …";
  try{
    const v = JSON.parse(localStorage.getItem(VAULT)); SALT = unb64(v.salt);
    const key = await deriveKey(pin, SALT); const raw = await openWith(key, v);
    KEY = key; D = normalize(raw); takeSnap(); if (!raw.v || raw.v < 2) await persist(false);
    pinBuf = ""; enterApp(false); return true;
  }catch(e){ return false; }
}
function showLock(mode){
  pinMode = mode; pinBuf = ""; drawDots();

  const bioKey = document.querySelector('.key[data-k="bio"]');

}

/* ---------- Touch ID / Face ID (Passkey + PRF-Erweiterung) ----------
   Die PIN wird mit einem Schlüssel verschlüsselt, den nur der Passkey nach
   biometrischer Bestätigung liefert (WebAuthn-PRF). Ohne Fingerabdruck/Gesicht
   bleibt die PIN unlesbar. Gespeichert nur auf diesem Gerät. */
const BIO = "budget.bio.v1";
const BIO_ICON = `<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7.5 4.6A8.5 8.5 0 0 1 20.5 12M3.5 12a8.5 8.5 0 0 1 1.6-5M12 7a5 5 0 0 1 5 5c0 2.5-.4 4.6-1.2 6.4M7 12a5 5 0 0 1 1.5-3.6M7 12c0 3-.6 5.2-1.6 6.8M12 11.5c0 3.6-.8 6.4-2.2 8.5M12 11.5v.5M16.6 20.2c.3-.8.6-1.7.8-2.7M3.6 15.5c.3-1 .4-2.2.4-3.5"/></svg>`;
let bioBusy = false;
const bioData = () => { try { return JSON.parse(localStorage.getItem(BIO)); } catch { return null; } };
const bioEnabled = () => !!bioData() && !!window.PublicKeyCredential;
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function bioSupported(){
  if (!window.PublicKeyCredential || !navigator.credentials) return false;
  try { if (!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) return false; } catch { return false; }
  try { if (PublicKeyCredential.getClientCapabilities){ const c = await PublicKeyCredential.getClientCapabilities(); if (c && c["extension:prf"] === false) return false; } } catch {}
  return true;
}
async function bioKeyFrom(prfOut){
  const base = await crypto.subtle.importKey("raw", prfOut, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:new Uint8Array(32), info:enc.encode("budget-bio-v1")}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function bioPrf(credId, salt){
  const a = await navigator.credentials.get({publicKey:{challenge:rnd(32), allowCredentials:[{type:"public-key", id:credId}], userVerification:"required", timeout:60000, extensions:{prf:{eval:{first:salt}}}}});
  const out = a?.getClientExtensionResults?.().prf?.results?.first;
  if (!out) throw new Error("noprf");
  return out;
}
async function bioEnable(pin){
  const salt = rnd(32);
  const cred = await navigator.credentials.create({publicKey:{
    rp:{name:"Budget"}, user:{id:rnd(16), name:"budget-" + location.hostname, displayName:"Budget-App"},
    challenge:rnd(32), pubKeyCredParams:[{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform", residentKey:"required", userVerification:"required"},
    timeout:60000, extensions:{prf:{eval:{first:salt}}}}});
  const ext = cred.getClientExtensionResults?.() || {};
  if (ext.prf && ext.prf.enabled === false) throw new Error("noprf");
  const credId = new Uint8Array(cred.rawId);
  const out = ext.prf?.results?.first || await bioPrf(credId, salt);
  const box = await sealWith(await bioKeyFrom(out), {pin});
  localStorage.setItem(BIO, JSON.stringify({credId:b64(credId), salt:b64(salt), ...box}));
}
async function bioRewrap(newPin){
  const b = bioData(); if (!b) return;
  try { const out = await bioPrf(unb64(b.credId), unb64(b.salt)); const box = await sealWith(await bioKeyFrom(out), {pin:newPin}); localStorage.setItem(BIO, JSON.stringify({...b, ...box})); return true; }
  catch { localStorage.removeItem(BIO); return false; }
}
async function bioUnlock(userTap){
  if (bioBusy || KEY || !bioEnabled()) return;
  bioBusy = true;
  try{
    const b = bioData();
    const out = await bioPrf(unb64(b.credId), unb64(b.salt));
    const {pin} = await openWith(await bioKeyFrom(out), b);
    if (!(await unlockWith(pin))){ localStorage.removeItem(BIO); failPin("PIN eingeben – Touch ID neu einrichten"); }
  }catch(e){
    if (userTap){ $("#lockMsg").textContent = e.name === "NotAllowedError" ? "Abgebrochen – PIN eingeben" : "Touch ID nicht verfügbar – PIN eingeben"; }
  }finally{ bioBusy = false; }
}
function bioSettings(){
  if (bioEnabled()){
    openSheet(`<h2>🔓 Touch ID / Face ID</h2><p class="hint">Ist auf diesem Gerät aktiv. Beim Öffnen erscheint automatisch die Abfrage – die PIN funktioniert weiterhin als Ausweg.</p>
      <button class="btn sec" id="bioTest">Jetzt testen</button><button class="btn del" id="bioOff">Ausschalten</button>`);
    $("#bioTest").onclick = async () => { const b = bioData(); try { await bioPrf(unb64(b.credId), unb64(b.salt)); toast("✅ Erkannt"); } catch { toast("❌ Nicht bestätigt"); } };
    confirmBtn($("#bioOff"), "Wirklich ausschalten? Nochmal tippen", () => { localStorage.removeItem(BIO); closeSheet(); toast("Touch ID / Face ID ausgeschaltet"); renderSet(); });
    return;
  }
  openSheet(`<h2>🔓 Touch ID / Face ID</h2><p class="hint">Entsperre die App mit Fingerabdruck oder Gesicht statt PIN. Dafür legt dein iPhone einen <b>Passkey</b> für diese App an (im iCloud-Schlüsselbund). Bestätige zur Sicherheit einmal deine PIN.</p>
    <div class="field"><label>Deine PIN</label><input class="inp num" id="bp" type="password" inputmode="numeric" maxlength="${PIN_LEN}" autocomplete="off"></div>
    <button class="btn" id="bioOn">Aktivieren</button>`);
  setTimeout(() => $("#bp").focus(), 300);
  $("#bioOn").onclick = async () => {
    const pin = $("#bp").value;
    try { await openWith(await deriveKey(pin, SALT), JSON.parse(localStorage.getItem(VAULT))); } catch { return toast("❌ PIN falsch"); }
    if (!(await bioSupported())) return toast("❌ Auf diesem Gerät/Browser nicht verfügbar");
    try { await bioEnable(pin); closeSheet(); celebrate(); toast("🔓 Touch ID / Face ID aktiviert"); renderSet(); }
    catch(e){ toast(e.message === "noprf" ? "❌ Dieser Browser unterstützt das leider nicht (iOS 18 oder neuer nötig)" : e.name === "NotAllowedError" ? "Abgebrochen" : "❌ Einrichten fehlgeschlagen"); }
  };
}

/* ---------- Berechnungen ---------- */
const cat = id => D.categories.find(c => c.id === id) || {id:"sonst", name:"Sonstiges", emoji:"📦"};
const isSaving = id => !!cat(id).saving;
const activeFixed = ym => D.fixed.filter(f => (f.from || "0000-00") <= ym && (!f.until || f.until >= ym));
const isSalary = x => (x.kind || "gehalt") === "gehalt";
/* Eingänge eines Monats. Fehlt das Gehalt, wird das letzte bekannte Gehalt als Schätzung angezeigt (nie gespeichert). */
function incomesFor(ym){
  const real = Array.isArray(D.incomes[ym]) ? D.incomes[ym] : [];
  let est = [], from = null;
  if (!real.some(isSalary)){
    from = Object.keys(D.incomes).filter(k => k < ym && (D.incomes[k] || []).some(isSalary)).sort().pop() || null;
    if (from) est = D.incomes[from].filter(isSalary).map(x => ({...x, est:true}));
  }
  const list = [...est, ...real], sum = a => a.reduce((t, x) => t + (x.amount || 0), 0);
  return {list, real, est: est.length > 0, from, salary: sum(list.filter(isSalary)), other: sum(list.filter(x => x.kind === "sonstig")), interest: sum(list.filter(x => x.kind === "zinsen"))};
}
const txFor = ym => D.tx.filter(t => t.date.slice(0,7) === ym);

/* Kredit: Restschuld & Rate je Monat (Annuität, Zins monatlich) */
function loanCalc(l, ym){
  if (ym < (l.from || l.asOf)) return {pay:0, bal:null};
  if (ym <= l.asOf) return {pay:l.rate, bal: ym === l.asOf ? l.balance : null};
  const r = (l.interest || 0) / 1200; let b = l.balance, m = l.asOf, pay = 0;
  while (m < ym){ m = addM(m, 1); const i = b * r; pay = Math.min(l.rate, b + i); b = Math.max(0, b + i - pay); if (b <= 0.005 && m < ym){ return {pay:0, bal:0}; } }
  return {pay, bal:b};
}
function loanPlan(l){
  const r = (l.interest || 0) / 1200, future = CUR() < l.asOf;
  // Startpunkt: heute – oder bei Krediten in der Zukunft der Monat vor der ersten Rate
  let m = future ? l.asOf : CUR(), b = future ? l.balance : (loanCalc(l, CUR()).bal ?? l.balance);
  const start = m, startBal = b; let n = 0, interest = 0;
  if (b > 0 && l.rate <= b * r) return {endless:true, bal:b, future};
  while (b > 0.005 && n < 1200){ m = addM(m, 1); const i = b * r; interest += i; b = b + i - Math.min(l.rate, b + i); n++; }
  return {bal: startBal, months:n, end: n ? addM(start, n) : start, interest, future, first: future ? addM(l.asOf, 1) : null};
}

function summary(ym){
  const inc = incomesFor(ym), fixed = activeFixed(ym);
  let fix = 0, savFix = 0, vari = 0, savTx = 0;
  const perFix = new Map(), perTx = new Map();
  const add = (map, id, v) => { const c = cat(id); const e = map.get(c.id) || {c, sum:0, n:0}; e.sum += v; e.n++; map.set(c.id, e); };
  fixed.forEach(f => { const v = monthlyOf(f); if (isSaving(f.cat)) savFix += v; else fix += v; add(perFix, f.cat, v); });
  const tx = txFor(ym);
  tx.forEach(t => { if (isSaving(t.cat)) savTx += t.amount; else vari += t.amount; add(perTx, t.cat, t.amount); });
  const loans = D.loans.reduce((a, l) => a + loanCalc(l, ym).pay, 0);
  const income = inc.salary + inc.other, fixTotal = fix + savFix + loans, freeFix = income - fixTotal;
  return {income, salary: inc.salary, other: inc.other, interest: inc.interest, est: inc.est, estFrom: inc.from, fix, savFix, savTx, sav: savFix + savTx, vari, loans, fixTotal, freeFix, free: freeFix - vari - savTx,

function nextDue(it, from = new Date()){
  const step = INTERVALS[it.interval]?.step ?? 1, start = (it.month || 1) - 1, day = it.day || 1;
  const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  for (let i = 0; i < 25; i++){
    const mAbs = from.getMonth() + i, m = ((mAbs % 12) + 12) % 12;
    if (step > 1 && (((m - start) % step) + step) % step !== 0) continue;
    const yy = from.getFullYear() + Math.floor(mAbs / 12), last = new Date(yy, m + 1, 0).getDate();
    const d = new Date(yy, m, Math.min(day, last)); if (d >= today) return d;
  }

}

function goalInfo(g){
  const rest = Math.max(0, g.target - (g.saved || 0)), pct = g.target ? Math.min(1, (g.saved || 0) / g.target) : 0;
  let need = null, eta = null;
  if (g.due){ const n = Math.max(1, ymDiff(CUR(), g.due)); need = rest / n; }
  if (g.monthly > 0 && rest > 0) eta = addM(CUR(), Math.ceil(rest / g.monthly));
  return {rest, pct, need, eta, done: rest <= 0};
}

function animate(target){

  const el = $("#heroNum"); if (!el) return;
  const t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(Math.abs(target) * e, true); if (p < 1) requestAnimationFrame(step); };

}

/* Monatsrückblick */
function openReview(m){ REVIEW = m; go("review"); }

  const M = REVIEW || addM(CUR(), -1), P = addM(M, -1), N = addM(M, 1);

  const ins = [];

    const yearSal = Array.from({length:12}, (_, i) => realSalary(`${y}-${pad2(i+1)}`)).filter(v => v > 0).sort((a,b) => b - a);
    const rank = yearSal.indexOf(realSalary(M)) + 1;
    ins.push([dSal > 0 ? "up" : "down", dSal > 0 ? "var(--free)" : "var(--danger)", `Gehalt <b>${fmt(Math.abs(dSal))} ${dSal > 0 ? "höher" : "niedriger"}</b> als im ${ymLabel(P, true)}.${rank > 0 && rank <= 3 && yearSal.length > 3 ? ` ${["Höchster", "Zweithöchster", "Dritthöchster"][rank-1]} Monat ${y}.` : ""}`]);

  if (big) ins.push(["house", "var(--orange2)", `Größter Fixposten: <b>${esc(big.c.name)}</b> mit ${fmt(big.sum, true)} (${pct(big.sum, s.fixTotal)} % der Fixkosten).`]);
  const prevNames = new Map(activeFixed(P).map(f => [f.name, f])), curNames = new Map(s.fixed.map(f => [f.name, f]));
  s.fixed.forEach(f => { const o = prevNames.get(f.name); if (!o) ins.push(["plus", "var(--orange2)", `Neu: <b>${esc(f.name)}</b> (${fmt(monthlyOf(f))}/Monat).`]); else if (Math.abs(monthlyOf(o) - monthlyOf(f)) > 0.004) ins.push([monthlyOf(f) > monthlyOf(o) ? "up" : "down", monthlyOf(f) > monthlyOf(o) ? "var(--danger)" : "var(--free)", `<b>${esc(f.name)}</b>: ${fmt(monthlyOf(o))} → ${fmt(monthlyOf(f))}.`]); });
  activeFixed(P).forEach(f => { if (!curNames.has(f.name)) ins.push(["down", "var(--free)", `Weggefallen: <b>${esc(f.name)}</b> (${fmt(monthlyOf(f))}/Monat).`]); });
  D.loans.forEach(l => { const c = loanCalc(l, M), n = loanCalc(l, N); if (c.pay > 0 && n.pay === 0) ins.push(["card", "var(--free)", `🎉 <b>${esc(l.name)}</b> ist abbezahlt!`]); else if (c.pay > 0){ let k = 0, m = N; while (loanCalc(l, m).pay > 0 && k < 600){ k++; m = addM(m, 1); } ins.push(["card", "#C98BEB", `${esc(l.name)}: <b>noch ${k} ${k === 1 ? "Rate" : "Raten"}</b>${k ? `, fertig im ${ymLabel(addM(M, k))}` : ""}.`]); } });
  D.goals.forEach(g => { const dep = (g.log || []).filter(x => x.d.slice(0,7) === M).reduce((a, x) => a + x.a, 0); if (dep) ins.push(["goal", "#8DB4FF", `Sparziel ${esc(g.name)}: <b>${dep > 0 ? "+" : ""}${fmt(dep, true)}</b>, jetzt bei ${Math.round(goalInfo(g).pct * 100)} %.`]); });
  if (s.tx.length){ const bc = {}; s.tx.forEach(t => bc[t.cat] = (bc[t.cat] || 0) + t.amount); const top = Object.entries(bc).sort((a,b) => b[1]-a[1])[0]; ins.push(["receipt", "#D9B44A", `Alltag: ${fmt(s.vari + s.savTx, true)} in ${s.tx.length} Einträgen – am meisten für ${esc(cat(top[0]).name)}.`]); }
  const n = summary(N), nextFree = s.salary + (n.other || 0) - n.fixTotal;
  const tile = (lbl, val, sub, col) => `<div class="rtile"><span>${lbl}</span><b class="num">${val}</b><small style="color:${col || "var(--faint)"}">${sub}</small></div>`;
  const diffTxt = (v, unit = "€") => Math.abs(v) < 0.5 ? "unverändert" : (v > 0 ? "+" : "−") + (unit === "€" ? fmt(Math.abs(v)) : Math.abs(v) + " Punkte") + ` ggü. ${ymLabel(P, true)}.`;
  $("#view").innerHTML = `<div class="view">
    <div class="hint" style="margin:0 0 10px">Abgeschlossen am ${dim(M)}.${M.slice(5)}.${M.slice(0,4)}</div>
    <div class="card hero ${s.free >= 0 ? "green" : ""}">
      <div class="lbl">${ymLabel(M)} · am Monatsende übrig</div>

    </div>

      ${tile("Fixkosten gesamt", fmt(s.fixTotal), monthHasData(P) ? diffTxt(s.fixTotal - p.fixTotal) : "", s.fixTotal - p.fixTotal > 0.5 ? "var(--danger)" : s.fixTotal - p.fixTotal < -0.5 ? "var(--free)" : "")}
      ${tile("Fixquote", pct(s.fixTotal, s.income) + " %", monthHasData(P) ? diffTxt(dFixQ, "pt") : "", dFixQ < 0 ? "var(--free)" : dFixQ > 0 ? "var(--danger)" : "")}

    <div class="card opt"><h3>Ausblick ${ymLabel(N)}</h3><p class="hint" style="margin:0;color:var(--text2)">Fixkosten gesamt <b style="color:var(--text)">${fmt(n.fixTotal, true)}</b>${Math.abs(n.fixTotal - s.fixTotal) > 0.5 ? ` (${n.fixTotal > s.fixTotal ? "+" : "−"}${fmt(Math.abs(n.fixTotal - s.fixTotal), true)})` : ""}. Bei einem Gehalt wie im ${ymLabel(M, true)}. bleiben dir rund <b style="color:var(--free)">${fmt(nextFree, true)}</b> frei.</p></div>
    <button class="btn" onclick="SEL='${N > CUR() ? CUR() : N}';go('home')">Weiter zum ${ymLabel(N > CUR() ? CUR() : N, true)}.</button>
  </div>`;
  animate(s.free);

/* Fixkosten & Kredite */
function fixRow(x){
  const iv = INTERVALS[x.interval] || INTERVALS.monthly;
  const when = x.day ? ` · am ${x.day}.${x.interval !== "monthly" ? " " + MONTHS[(x.month||1)-1].slice(0,3) + "." : ""}` : "";
  const ver = x.from > (D.fixed.filter(f => f.name === x.name).map(f => f.from).sort()[0] || x.from) ? `<span class="tag">seit ${ymLabel(x.from, true)}.</span>` : "";
  return `<div class="item" onclick="editFixed('${x.id}')"><div class="emo">${cat(x.cat).emoji}</div><div class="meta"><div class="n">${esc(x.name)}${ver}</div><div class="s">${iv.label}${when}${x.until ? " · endet " + ymLabel(x.until, true) + "." : ""}${x.note ? " · " + esc(x.note) : ""}</div></div><div class="a num">${fmt(x.amount)}${x.interval !== "monthly" ? `<small>${fmt(monthlyOf(x))} / Monat</small>` : ""}</div></div>`;
}
function loanCard(l){
  const c = loanCalc(l, SEL), p = loanPlan(l), bal = p.bal;
  const paidPct = l.original ? Math.max(0, Math.min(100, (1 - bal / l.original) * 100)) : null;
  return `<div class="card loan" onclick="editLoan('${l.id}')" style="cursor:pointer"><div class="lt"><div><div class="ln">🏦 ${esc(l.name)}</div><div class="ll">${esc(l.lender || "")}${l.interest ? (l.lender ? " · " : "") + String(l.interest).replace(".", ",") + " % Zins" : ""}</div></div><div class="lb num">${fmt(bal, true)}<small>${p.future ? "Kreditbetrag" : "Restschuld"}</small></div></div>
    ${paidPct != null ? `<div class="track"><div class="fill" data-w="${paidPct}"></div></div><div class="ll">${Math.round(paidPct)} % von ${fmt(l.original, true)} getilgt</div>` : ""}
    <div class="kv"><div><span>Rate</span><b class="num">${fmt(l.rate, true)}</b></div><div><span>${p.future ? "Start" : "Noch"}</span><b>${p.future ? ymLabel(p.first, true) + " " + p.first.slice(2,4) : p.endless ? "∞" : p.months + " Raten"}</b></div><div><span>Fertig</span><b>${p.endless ? "Rate zu klein" : p.months ? ymLabel(p.end, true) + " " + p.end.slice(0,4) : "✓"}</b></div></div>
    ${l.interest && !p.endless && p.interest > 1 ? `<div class="ll" style="margin-top:8px">Noch ca. ${fmt(p.interest, true)} Zinsen bis zum Ende</div>` : ""}
    ${c.pay === 0 && SEL >= (l.from || l.asOf) ? `<div class="ll" style="margin-top:8px;color:var(--free)">🎉 In ${ymLabel(SEL)} abbezahlt</div>` : ""}</div>`;
}
function renderFix(){
  const s = summary(SEL);
  const groups = new Map(); s.fixed.forEach(f => { const c = cat(f.cat); const g = groups.get(c.id) || {c, sum:0, items:[]}; g.sum += monthlyOf(f); g.items.push(f); groups.set(c.id, g); });
  const sorted = [...groups.values()].sort((a,b) => (a.c.saving - b.c.saving) || (b.sum - a.sum));
  const fixAll = s.fix + s.fixed.filter(f => isSaving(f.cat)).reduce((a,f) => a + monthlyOf(f), 0);
  $("#view").innerHTML = `<div class="view">${monthBar()}
    <div class="seg-ctl"><button class="${fixTab==="fix"?"on":""}" onclick="fixTab='fix';render()">Fixkosten</button><button class="${fixTab==="loan"?"on":""}" onclick="fixTab='loan';render()">Kredite</button></div>
    ${fixTab === "fix" ? `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="hello">Fix / Monat</div><div style="font-size:30px;font-weight:800;letter-spacing:-1px" class="num">${fmt(fixAll)}</div></div><div style="text-align:right"><div class="hello">pro Jahr</div><div style="font-size:18px;font-weight:700" class="num">${fmt(fixAll*12, true)}</div></div></div>
      ${sorted.map(g => `<div class="card"><div class="grouphead"><div class="emo">${g.c.emoji}</div><div><div class="gn">${esc(g.c.name)}</div><div class="gp">${g.c.saving ? "zählt als Ausgabe" : (fixAll ? Math.round(g.sum / fixAll * 100) : 0) + "% der Fixkosten"}</div></div><div class="gt num">${fmt(g.sum)}</div></div><div class="list">${g.items.sort((a,b) => monthlyOf(b) - monthlyOf(a)).map(fixRow).join("")}</div></div>`).join("") || `<div class="card"><div class="empty"><span class="e">🏠</span>Keine Fixkosten in ${ymLabel(SEL)}</div></div>`}
      <button class="addrow" onclick="editFixed()">＋ Fixkosten / Sparrate</button>
      <p class="hint" style="text-align:center;margin-top:12px">Änderungen gelten ab dem gewählten Monat – frühere Monate bleiben in der Historie unverändert.</p>`

      <button class="addrow" onclick="editLoan()">＋ Kredit / Abzahlung</button>`}
  </div>`;
  animate(0);
}

async function confirmIncomes(){

/* Repariert Monate, in die durch einen Fehler (bis 2.6.1) die Vormonats-Einträge mitkopiert wurden */
function repairIncomeStack(){
  const same = (a, b) => a && b && a.name === b.name && Math.abs((a.amount || 0) - (b.amount || 0)) < 0.005 && (a.note || "") === (b.note || "");
  const months = Object.keys(D.incomes).sort(), orig = structuredClone(D.incomes);
  let removed = 0, prev = null;
  for (const m of months){
    const L = D.incomes[m] || [];
    if (prev && L.length > prev.length && prev.every((p, j) => same(p, L[j]))){ D.incomes[m] = L.slice(prev.length); removed += prev.length; }
    if ((orig[m] || []).length) prev = orig[m];
  }
  return removed;
}

  }
}

/* BANK-PARSER-START */
const MONTH_NAMES = {jan:1,januar:1,feb:2,februar:2,"mär":3,maer:3,mar:3,"märz":3,maerz:3,apr:4,april:4,mai:5,jun:6,juni:6,jul:7,juli:7,aug:8,august:8,sep:9,sept:9,september:9,okt:10,oktober:10,nov:11,november:11,dez:12,dezember:12};
const NOISE = /^(kartenzahlung|lastschrift|sepa[- ]?lastschrift|überweisung|ueberweisung|dauerauftrag|gutschrift|zahlung|debitkarte|kreditkarte|visa|mastercard|girocard|apple pay|google pay|vorgemerkt|gebucht|umsätze|umsaetze|ausgaben|einnahmen|alle|suche|filter|heute|gestern|kontostand.*|saldo.*|verfügbar.*|verfuegbar.*|[a-z]{0,2})$/i;
const SKIP_LINE = /kontostand|saldo|verfügbar|verfuegbar|dispo|kreditrahmen|iban|bic\b/i;
const AMOUNT_RE = /([+\-−–]?)\s?(\d{1,3}(?:[.\s']\d{3})*|\d+),(\d{2})(?!\d)\s?(€|eur)?/i;

function parseDateIn(line, refYear, today){
  const l = line.toLowerCase().trim();
  let m;
  if (/^heute\b/.test(l)) return today.toISOString().slice(0,10);
  if (/^gestern\b/.test(l)){ const d = new Date(today); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
  if ((m = l.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/))){
    let y = m[3] ? +m[3] : refYear; if (y < 100) y += 2000;
    const mo = +m[2], d = +m[1]; if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${y}-${pad2(mo)}-${pad2(d)}`;
  }
  if ((m = l.match(/(\d{1,2})\.?\s+([a-zäöü]{3,9})\.?\s*(\d{4})?/))){
    const mo = MONTH_NAMES[m[2]] || MONTH_NAMES[m[2].slice(0,3)];
    if (mo){ const y = m[3] ? +m[3] : refYear; return `${y}-${pad2(mo)}-${pad2(+m[1])}`; }
  }
  return null;
}
function cleanName(s){
  return s.replace(AMOUNT_RE, "").replace(/\b\d{1,2}\.\d{1,2}\.(\d{2,4})?\b/g, "")
    .replace(/[|•·>›»<«_=~*#]+/g, " ").replace(/\s{2,}/g, " ").replace(/^[\s\-–,.:;]+|[\s\-–,.:;]+$/g, "").trim();
}
function letters(s){ return (s.match(/[a-zäöüß]/gi) || []).length; }

/** Liest erkannten Text eines Banking-Screenshots und liefert Buchungen. */
function parseBankText(text, today = new Date()){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const out = [];
  let curDate = null, lastText = null, lastTextIdx = -9;
  const refYear = today.getFullYear();
  lines.forEach((line, idx) => {
    if (SKIP_LINE.test(line)) return;
    const am = line.match(AMOUNT_RE);
    const dt = parseDateIn(line, refYear, today);
    if (!am){
      if (dt && letters(cleanName(line).replace(/\b(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|mo|di|mi|do|fr|sa|so|heute|gestern|januar|februar|märz|april|mai|juni|juli|august|september|oktober|november|dezember)\b/gi, "")) < 3){ curDate = dt; return; }
      if (dt) curDate = dt;
      const n = cleanName(line);
      if (letters(n) >= 3 && !NOISE.test(n)) { lastText = n; lastTextIdx = idx; }
      return;
    }
    const sign = am[1];
    const value = parseFloat(am[2].replace(/[.\s']/g, "") + "." + am[3]);
    if (!value) return;
    let name = cleanName(line);
    if (letters(name) < 3 || NOISE.test(name)) name = (lastText && idx - lastTextIdx <= 3) ? lastText : "";
    if (!name) return;
    const positive = sign === "+";
    const date = dt || curDate || today.toISOString().slice(0,10);
    out.push({date, name: name.slice(0, 60), amount: value, income: positive});
    lastText = null;
  });
  return out;
}

];
function merchantKey(name){ return name.toLowerCase().replace(/[^a-zäöüß0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 1).slice(0, 2).join(" "); }
function guessCategory(name, rules = {}){
  const k = merchantKey(name);
  if (rules[k]) return rules[k];
  const first = k.split(" ")[0];
  const hit = Object.keys(rules).find(r => r.split(" ")[0] === first && first.length >= 4);
  if (hit) return rules[hit];
  for (const [cat, re] of CAT_HINTS) if (re.test(name)) return cat;
  return "sonst";
}

function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = TESSERACT_URL; s.onload = res; s.onerror = () => rej(new Error("Texterkennung konnte nicht geladen werden (Internet?)")); document.head.appendChild(s); });

/* Bild für OCR aufbereiten: Graustufen, Dark-Mode invertieren, Kontrast */
function prepImage(file){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const scale = img.width < 900 ? 2 : img.width > 2200 ? 2200 / img.width : 1;
      const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height), p = d.data; let sum = 0;
      for (let i = 0; i < p.length; i += 4){ const g = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2]; p[i] = p[i+1] = p[i+2] = g; sum += g; }
      const invert = sum / (p.length / 4) < 120;
      for (let i = 0; i < p.length; i += 4){ let g = invert ? 255 - p[i] : p[i]; g = Math.max(0, Math.min(255, (g - 128) * 1.5 + 128)); p[i] = p[i+1] = p[i+2] = g; }
      x.putImageData(d, 0, 0); URL.revokeObjectURL(img.src); res(c);
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

/* ---------- Kontoauszüge (PDF) – Auswertung nur auf dem Gerät ---------- */
/* STATEMENT-PARSER-START */
/* Kontoauszug-PDF → Zeilen → Buchungen → Vorschlag (läuft komplett auf dem Gerät) */
const ST_AMT = /^([+\-−–]?)\s?(\d{1,3}(?:[.\s]\d{3})*|\d+),(\d{2})\s?([+\-−–]|S|H)?\s?(?:EUR|€)?\s?([+\-−–]|S|H)?$/;
const ST_AMT_IN = /([+\-−–]\s?)?(\d{1,3}(?:\.\d{3})*|\d+),(\d{2})(\s?[+\-−–]|\s?(?:S|H)\b)?/g;
const ST_DATE = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/;
const ST_SKIP = /generiert am|eur-kontoauszug|zweigniederlassung deutschland$|verlorene oder gestohlene|kontostand|saldo|übertrag auf blatt|übertrag von blatt|^übertrag|seite \d+ (von|\/) \d+|blatt \d+|iban:?\s*de\d{2}\s?\d{4}|^bic\b|summe (der )?(soll|haben|umsätze)|gesamtumsatz|dispositionskredit|kreditlinie|^buchung(stag)?\b.*wert|^datum\b|^bu-tag|^vorgang|^erläuterung|^text\b/i;
const ST_TYPES = /\b(sepa[- ]?)?(basis|firmen)?(erst|folge)?lastschrift(einzug)?\b|\bkartenzahlung\b|\bgirocard\b|\bdebitkarte\b|\bkreditkarte\b|\b(echtzeit|dauer|sammel)?überweisung(sauftrag)?\b|\bdauerauftrag\b|\bgutschrift\b|\bzahlungseingang\b|\babbuchung\b|\bbargeldauszahlung\b|\bauszahlung\b|\beinzahlung\b|\bumbuchung\b|\bonline-?banking\b|\bapple pay\b|\bgoogle pay\b|\bvisa\b|\bmastercard\b|\bmaestro\b|\bpos\b|\bec\b/gi;
const ST_NOISE = /iban|bic\b|mandat|mref|eref|kref|cred\b|gläubiger|glaeubiger|end-to-end|referenz|kundenref|svwz|abwa|abwe|^\d|\d{2}:\d{2}|^[A-Z]{2}\d{2}[A-Z0-9 ]{10,}|^karte\b|^kartennr|^terminal|^folgenr|^verfall|^ref\.?\b|^(empfänger|auftraggeber|zahlungsempfänger|zahlungspflichtiger):?\s*$/i;
const ST_NUM = s => parseFloat(s.replace(/[.\s]/g, "").replace(",", "."));
const stPad = n => String(n).padStart(2, "0");

/* pdf.js-Textinhalt → Zeilen (gleiche Höhe zusammenfassen, links nach rechts) */
function stItemsToLines(pages){
  const lines = [];
  pages.forEach((items, p) => {
    const rows = [];
    items.filter(it => it.str && it.str.trim()).forEach(it => {
      const y = it.y, row = rows.find(r => Math.abs(r.y - y) <= Math.max(2, (it.h || 8) * 0.35));
      if (row) row.items.push(it); else rows.push({y, items:[it]});
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => {
      r.items.sort((a, b) => a.x - b.x);
      // benachbarte Stücke ohne Lücke verbinden
      const merged = [];
      r.items.forEach(it => { const last = merged[merged.length - 1]; if (last && it.x - (last.x + last.w) < 1.2) { last.str += it.str; last.w = it.x + it.w - last.x; } else merged.push({...it}); });
      lines.push({page: p, y: r.y, items: merged, text: merged.map(i => i.str.trim()).filter(Boolean).join(" ").replace(/\s{2,}/g, " ")});
    });
  });
  return lines;
}

function stPeriod(lines, today){
  const all = lines.map(l => l.text).join("\n");
  let m = all.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})\s*(?:-|–|bis)\s*(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) return {start: `${m[3]}-${stPad(m[2])}-${stPad(m[1])}`, end: `${m[6]}-${stPad(m[5])}-${stPad(m[4])}`, endY: +m[6], endM: +m[5]};
  const MN = {januar:1,februar:2,"märz":3,maerz:3,april:4,mai:5,juni:6,juli:7,august:8,september:9,oktober:10,november:11,dezember:12};
  m = all.match(/von\s+(\d{1,2})\.\s*([a-zäöü]+)\s+(\d{4})\s+bis\s+(\d{1,2})\.\s*([a-zäöü]+)\s+(\d{4})/i);
  if (m && MN[m[2].toLowerCase()] && MN[m[5].toLowerCase()]) return {start: `${m[3]}-${stPad(MN[m[2].toLowerCase()])}-${stPad(m[1])}`, end: `${m[6]}-${stPad(MN[m[5].toLowerCase()])}-${stPad(m[4])}`, endY: +m[6], endM: MN[m[5].toLowerCase()]};
  m = all.match(/(\d{1,2})\.(\d{1,2})\.(20\d{2})/g);
  if (m && m.length){ const last = m.map(x => x.split(".")).map(([d, mo, y]) => `${y}-${stPad(mo)}-${stPad(d)}`).sort().pop(); return {end: last, endY: +last.slice(0,4), endM: +last.slice(5,7)}; }
  m = all.match(/\b(20\d{2})\b/);
  const y = m ? +m[1] : today.getFullYear();
  return {endY: y, endM: 12};
}

/* Spaltenköpfe Soll/Haben erkennen (für Auszüge ohne Vorzeichen) */
function stColumns(lines){
  for (const l of lines){
    const t = l.text.toLowerCase();
    if (/saldo|zusammenfassung|produkt/.test(t)) continue;
    const pairs = [["soll","haben"], ["belastung","gutschrift"], ["lastschrift","gutschrift"], ["ausgang","eingang"], ["ausgaben","einnahmen"], ["abgang","zugang"], ["lasten","gunsten"]];
    for (const [a, b] of pairs){
      if (t.includes(a) && t.includes(b)){
        const ia = l.items.find(i => i.str.toLowerCase().includes(a)), ib = l.items.find(i => i.str.toLowerCase().includes(b));
        if (ia && ib && ia !== ib) return {debitX: ia.x + ia.w / 2, creditX: ib.x + ib.w / 2};
      }
    }
  }
  return null;
}

function stDate(str, per){
  const m = str.match(ST_DATE); if (!m) return null;
  const d = +m[1], mo = +m[2]; if (d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  let y = m[3] ? +m[3] : per.endY; if (y < 100) y += 2000;
  if (!m[3] && per.endM && mo > per.endM + 1) y -= 1;  // z. B. Auszug Jan, Buchung 30.12.
  return `${y}-${stPad(mo)}-${stPad(d)}`;
}

/* Kontoinhaber: Namenszeile direkt über der Anschrift (erste Seite) */
function stOwner(lines){
  const first = lines.filter(l => l.page === 0).slice(0, 18);
  for (let i = 0; i < first.length - 1; i++){
    const t = first[i].text.trim(), nx = first[i + 1].text.trim();
    if (/^[A-Za-zÄÖÜäöüß\- ]{5,60}$/.test(t) && t.split(/\s+/).length >= 2 && t.split(/\s+/).length <= 5 && !/bank|kontoauszug|konto|zusammenfassung|deutschland|filiale/i.test(t)
        && /^[A-ZÄÖÜ][A-Za-zÄÖÜäöüß.\- ]+\s\d+[a-z]?\b/.test(nx)) return t.toLowerCase().split(/\s+/).filter(w => w.length >= 3);
  }
  return [];
}
/* Zeilen → Buchungen */
function parseStatementLines(lines, today = new Date()){
  const per = stPeriod(lines, today), cols = stColumns(lines), out = [], owner = stOwner(lines);
  let cur = null, section = "Konto";
  const finish = () => { if (cur){ cur.extra = cur.extra.slice(0, 5); out.push(cur); cur = null; } };
  for (const l of lines){
    const t = l.text.trim();
    if (!t) continue;
    // Abschnitt (z. B. Revolut: „Kontotransaktionen von …“, „Einzahlung von Transaktionen von …“)
    const sec = t.match(/^(.*?)\s*(?:von\s+)?transaktionen\s+von\b/i) || t.match(/^(umsätze|kontoumsätze)\s+(.*)$/i);
    if (sec && !ST_DATE.test(t)){ finish(); const nm = (sec[1] || "").replace(/^konto$/i, "").replace(/\s*von$/i, "").trim(); section = /^(konto|)$/i.test(nm) ? "Girokonto" : nm.replace(/^einzahlung$/i, "Einzahlung (Unterkonten)"); continue; }
    if (t.length > 125){ finish(); continue; }   // Rechtstexte im Fuß
    const startsDate = ST_DATE.test(t);
    // Betrag: erstes Stück, das wie ein Betrag aussieht (nicht das Datum)
    let amtItem = null, amtMatch = null;
    if (startsDate){
      for (const it of l.items){ const s = it.str.trim(); const mm = s.match(ST_AMT); if (mm && !ST_DATE.test(s)){ amtItem = it; amtMatch = mm; break; } }
      if (!amtItem){ // Betrag steckt im Fließtext
        const txt = t.replace(/^(\d{1,2}\.\d{1,2}\.(\d{2,4})?\s*){1,2}/, "");
        const all = [...txt.matchAll(ST_AMT_IN)].filter(x => !/^\d{1,2}\.\d{1,2}\.$/.test(x[0]));
        if (all.length){ const x = all[0]; amtMatch = [x[0], (x[1] || "").trim(), x[2], x[3], (x[4] || "").trim(), ""]; }
      }
    }
    if (startsDate && amtMatch && !ST_SKIP.test(t)){
      finish();
      const dates = t.match(/^(\d{1,2}\.\d{1,2}\.(\d{2,4})?)\s*(\d{1,2}\.\d{1,2}\.(\d{2,4})?)?/);
      const date = stDate(dates[1], per);
      if (!date) continue;
      const value = ST_NUM(amtMatch[2] + "," + amtMatch[3]);
      const sig = (amtMatch[1] || amtMatch[4] || amtMatch[5] || "").replace(/[−–]/, "-");
      let credit = null;
      if (sig === "-" || sig === "S") credit = false; else if (sig === "+" || sig === "H") credit = true;
      else if (cols && amtItem){ const c = amtItem.x + amtItem.w / 2; credit = Math.abs(c - cols.creditX) < Math.abs(c - cols.debitX); }
      let desc = t.replace(/^(\d{1,2}\.\d{1,2}\.(\d{2,4})?\s*){1,2}/, "");
      desc = desc.replace(amtMatch[0].trim(), "").replace(ST_AMT_IN, "").replace(/€/g, " ").replace(/\s(S|H)\s*$/g, " ").replace(/\s{2,}/g, " ").trim();
      cur = {date, amount: value, credit, desc, extra: [], page: l.page, section};
    } else if (cur){
      if (ST_SKIP.test(t) || (startsDate && !amtMatch)) { if (ST_SKIP.test(t)) finish(); continue; }
      if (cur.extra.length < 6) cur.extra.push(t);
    }
  }
  finish();
  return {period: per, columns: !!cols, owner, sections: [...new Set(out.map(t => t.section))], tx: out.map(t => ({...stName(t), owner}))};
}

function stName(tx){
  const types = (tx.desc.match(ST_TYPES) || []).map(s => s.toLowerCase());
  const full = [tx.desc, ...tx.extra].join(" ");
  let rest = tx.desc.replace(ST_TYPES, " ").replace(/[|•·]/g, " ").replace(/\s{2,}/g, " ").trim().replace(/^[-–:,.\s]+|[-–:,.\s]+$/g, "");
  const letters = s => (s.match(/[a-zäöüß]/gi) || []).length;
  rest = rest.replace(/\/\/+/g, " ").replace(/\s{2,}/g, " ").trim();
  let name = letters(rest) >= 3 ? rest : "";
  if (!name){
    const c = tx.extra.map(e => e.replace(/^(empfänger|auftraggeber|zahlungsempfänger|zahlungspflichtiger|name|von|an):\s*/i, "").trim()).find(e => letters(e) >= 3 && !ST_NOISE.test(e));
    name = c || (types[0] ? types[0][0].toUpperCase() + types[0].slice(1) : "Buchung");
  }
  name = name.replace(/^(zahlung von|überweisung von|überweisung an|gutschrift von|to|an:|von:)\s+/i, "").replace(/\/\/+/g, " ").replace(/\s+(DE\d{2}[\d ]{10,}|\d{6,}).*$/, "").replace(/\s{2,}/g, " ").slice(0, 60).trim();
  if (tx.credit === null) tx.credit = /gutschrift|lohn|gehalt|bezüge|zins|zahlungseingang|eingang|erstattung|rückzahlung|einzahlung|rente|kindergeld/i.test(full);
  return {...tx, name, types, full};
}

/* Vorschlag je Buchung: gehalt | zinsen | sonstig | fix | newfix | alltag | ignore */
function stTokens(s){ return (s || "").toLowerCase().replace(/[^a-zäöüß0-9 ]/g, " ").split(/\s+/).filter(w => w.length >= 3 && !/^(inkl|und|der|die|das|gmbh|bank|sepa|von|fuer|für|mit|kto|nr)$/.test(w)); }
function classifyStatementTx(tx, ctx){
  const f = tx.full, ym = tx.date.slice(0, 7);
  if (/netto-zinsen|zinsen gezahlt|zinsgutschrift|habenzins/i.test(f) && tx.credit) return {type:"zinsen", note:"Zinsen"};
  if (/^(an|von) eur\b/i.test(tx.desc)) return {type:"ignore", note:"Umbuchung Unterkonto"};
  const own = tx.owner || [], nTok = stTokens(tx.name).filter(w => !/^(gmbh|von|an)$/.test(w));
  if (own.length && /&|\bund\b/i.test(tx.name) && own.filter(w => tx.name.toLowerCase().includes(w)).length >= 2) return {type:"ignore", note:"Gemeinschaftskonto"};
  if (own.length && nTok.length >= 2 && nTok.every(w => own.includes(w))) return {type:"ignore", note: tx.credit && tx.amount >= 1000 ? "von deinem anderen Konto – evtl. Gehalt?" : "Überweisung an/von dir selbst"};
  if (tx.credit){
    if (/zins|zinsgutschrift|habenzins|kapitalertrag.*gutschrift|ausschüttung|dividende/i.test(f) && !/sollzins|dispo/i.test(f)) return {type:"zinsen", note:"Zinsen"};
    const salTok = new Set(ctx.salaryTokens || []);
    if (/lohn|gehalt|bezüge|bezuege|entgelt|salary|besoldung/i.test(f) || stTokens(f).some(w => salTok.has(w))) return {type:"gehalt"};
    if (/umbuchung|übertrag|uebertrag|eigene[rn]? konto|kontoübertrag|vom tagesgeld|von tagesgeld|sparkonto/i.test(f)) return {type:"ignore", note:"Umbuchung zwischen eigenen Konten?"};
    return {type:"sonstig"};
  }
  if (/kapitalertrag|solidarit|kirchenst|abgeltung/i.test(f)) return {type:"zinsen", note:"Steuer auf Zinsen", negative:true};
  // Abgleich mit Fixkosten / Krediten des Monats
  const tTok = new Set(stTokens(tx.name + " " + tx.desc + " " + tx.extra.filter(e => !/^karte:/i.test(e)).join(" ")));
  const card = /karte:|kartenzahlung|girocard|debitkarte/i.test(f);
  let best = null;
  for (const fx of ctx.fixedFor(ym)){
    const amt = fx.amount, diff = Math.abs(amt - tx.amount), overlap = stTokens(fx.name).some(w => tTok.has(w));
    let score = 0;
    if (diff <= 0.01) score = overlap ? 5 : (!card && amt >= 25 ? 3 : 0);
    else if (diff <= Math.max(0.5, amt * 0.02)) score = overlap ? 4 : 0;
    else if (overlap && diff <= amt * 0.15) score = 1.5;
    if (score && (!best || score > best.score)) best = {score, fx, diff};
  }
  if (best && (best.score >= 4 || (best.score === 3 && ctx.fixedFor(ym).filter(x => Math.abs(x.amount - tx.amount) <= 0.01).length === 1) || best.score === 1.5))
    return {type:"fix", fix: best.fx, note: best.diff > 0.01 ? `passt zu „${best.fx.name}“ (${best.fx.amount.toFixed(2).replace(".", ",")} €, Betrag weicht ab)` : `passt zu „${best.fx.name}“`};
  if (/umbuchung|übertrag|uebertrag|eigene[rn]? konto|auf tagesgeld|an tagesgeld|zum tagesgeld|sparkonto/i.test(f)) return {type:"ignore", note:"Umbuchung zwischen eigenen Konten?"};
  return {type:"alltag", cat: ctx.guess(tx.name + " " + f)};
}
/* Wiederkehrende Abbuchungen (gleicher Empfänger, ähnlicher Betrag, ≥3 Monate) → als neue Fixkosten vorschlagen */
function markRecurring(rows){
  const groups = new Map();
  rows.filter(r => r.type === "alltag" && !r.credit).forEach(r => {
    const k = stTokens(r.name).slice(0, 2).join(" ") + "|" + Math.round(r.amount);
    (groups.get(k) || groups.set(k, []).get(k)).push(r);
  });
  for (const [, g] of groups){
    const months = new Set(g.map(r => r.date.slice(0, 7)));
    if (months.size >= 3 && g.every(r => Math.abs(r.amount - g[0].amount) <= Math.max(1, g[0].amount * 0.05))){
      const gid = "rg" + Math.random().toString(36).slice(2, 8);
      g.forEach(r => { r.type = "newfix"; r.group = gid; r.note = `kommt in ${months.size} Monaten vor`; });
    }
  }
  return rows;
}

const PDFJS_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/pdf.min.mjs";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/pdf.worker.min.mjs";
let PDFJS = null, pdfRows = [], pdfFound = [], pdfPending = false, pdfAppend = false;
const pdfKey = r => r.type === "zinsen" && r.section === "*" ? "z|" + r.date.slice(0, 7) : [r.date, r.amount, r.credit, r.desc, r.section].join("|");
async function loadPdfjs(){
  if (PDFJS) return PDFJS;
  try { PDFJS = await import(PDFJS_URL); PDFJS.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return PDFJS; }
  catch(e){ throw new Error("PDF-Leser konnte nicht geladen werden (Internet?)"); }
}
function startPDF(append){ pdfAppend = !!append && pdfPending; $("#pdfIn").value = ""; $("#pdfIn").click(); }
function askPdfPassword(name){
  return new Promise(res => {
    openSheet(`<h2>🔒 Passwort nötig</h2><p class="hint">„${esc(name)}“ ist geschützt. Das Passwort steht meist in der Mail deiner Bank (oft Geburtsdatum oder Kundennummer).</p>
      <div class="field"><input class="inp" id="pp" type="password" autocomplete="off"></div><button class="btn" id="ppOk">Öffnen</button><button class="btn sec" id="ppSkip">Datei überspringen</button>`);
    setTimeout(() => $("#pp").focus(), 300);
    $("#ppOk").onclick = () => res($("#pp").value); $("#ppSkip").onclick = () => res(null);
  });
}
async function pdfPages(file, pdfjs){
  const data = new Uint8Array(await file.arrayBuffer());
  let password;
  for (let tries = 0; tries < 4; tries++){
    try{
      const task = pdfjs.getDocument({data: data.slice(), password, isEvalSupported: false}), doc = await task.promise;
      const pages = [];
      for (let i = 1; i <= doc.numPages; i++){
        const pg = await doc.getPage(i), tc = await pg.getTextContent();
        pages.push(tc.items.map(it => ({str: it.str, x: it.transform[4], y: it.transform[5], w: it.width, h: it.height || Math.abs(it.transform[3])})));
      }
      try { await task.destroy(); } catch {} return pages;
    }catch(e){
      if (e?.name === "PasswordException"){ password = await askPdfPassword(file.name); if (password === null) return null; pdfProgressSheet(); continue; }
      throw e;
    }
  }
  return null;
}
function pdfProgressSheet(){
  if ($("#pdfMsg")) return;
  openSheet(`<h2>📄 Lese Kontoauszüge …</h2><p class="hint" id="pdfMsg">Lade PDF-Leser …</p><div class="prog"><div id="pdfBar"></div></div>
    <p class="hint">🔒 Die PDFs werden nur auf diesem Gerät ausgewertet und nirgendwo hochgeladen.</p>`);
}
$("#pdfIn").onchange = async e => {
  const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name)); if (!files.length) return;
  ocrBusy = true; pdfProgressSheet();
  const msg = t => { if ($("#pdfMsg")) $("#pdfMsg").textContent = t; }, bar = p => { if ($("#pdfBar")) $("#pdfBar").style.width = Math.round(p * 100) + "%"; };
  const found = [], periods = []; let failed = [];
  try{
    const pdfjs = await loadPdfjs();
    for (let i = 0; i < files.length; i++){
      msg(`Lese Auszug ${i + 1} von ${files.length} …`); bar(i / files.length);
      try{
        const pages = await pdfPages(files[i], pdfjs);
        if (!pages){ failed.push(files[i].name); continue; }
        const res = parseStatementLines(stItemsToLines(pages), new Date());
        if (!res.tx.length) failed.push(files[i].name);
        res.tx.forEach(t => found.push({...t, file: files[i].name}));
        if (res.period?.end) periods.push(res.period);
      }catch(err){ console.warn("PDF", files[i].name, err); failed.push(files[i].name); }
    }
    bar(1); ocrBusy = false;
    if (pdfAppend){ const seenK = new Set(pdfFound.map(t => t.date + "|" + t.amount + "|" + t.credit + "|" + t.desc + "|" + t.section)); found.forEach(t => { const k = t.date + "|" + t.amount + "|" + t.credit + "|" + t.desc + "|" + t.section; if (!seenK.has(k)){ seenK.add(k); pdfFound.push(t); } }); failed = [...pdfFailed, ...failed]; }
    else pdfFound = found;
    reviewPDF(pdfFound, failed, pdfAppend);
  }catch(err){
    ocrBusy = false;
    openSheet(`<h2>Hat nicht geklappt 😕</h2><p class="hint">${esc(err.message || err)}</p><button class="btn" onclick="startPDF()">Nochmal versuchen</button>`);
  }
};
const PDF_TYPES = [["gehalt","💶 Gehalt"], ["sonstig","🎁 Sonstiger Eingang"], ["zinsen","📈 Zinsen (keine Einnahme)"], ["fix","✓ Fixkosten (schon erfasst)"], ["newfix","🔁 Als neue Fixkosten anlegen"]];
let pdfAccounts = {};
function reviewPDF(found, failed, keepEdits){
  // Bei „Weitere PDFs“: bisherige Haken/Änderungen merken und danach wieder anwenden
  const edits = {}, prevAcc = {...pdfAccounts};
  if (keepEdits) pdfRows.filter(r => r.touched).forEach(r => edits[pdfKey(r)] = {on: r.on, type: r.type, cat: r.cat, name: r.name, date: r.date});
  // Doppelte Buchungen (überlappende Auszüge) entfernen
  const seen = new Set();
  const uniq = found.filter(t => { const k = t.date + "|" + t.amount + "|" + t.credit + "|" + t.name + "|" + t.section; if (seen.has(k)) return false; seen.add(k); return true; });
  const salaryTokens = [...new Set(Object.values(D.incomes).flat().filter(isSalary).flatMap(x => stTokens(x.name)))];
  const ctx = {salaryTokens, guess: n => guessCategory(n, D.rules),
    fixedFor: ym => [...activeFixed(ym).map(f => ({name: f.name, amount: f.amount, id: f.id})), ...D.loans.filter(l => loanCalc(l, ym).pay > 0).map(l => ({name: l.name + " " + (l.lender || ""), amount: l.rate, id: l.id}))]};
  let rows = uniq.map(t => ({...t, id: uid(), ...classifyStatementTx(t, ctx)}));
  // Zinsen (aus allen Konten) je Monat zu einem Eintrag zusammenfassen
  const zin = {};
  rows.filter(r => r.type === "zinsen").forEach(r => { const ym = r.date.slice(0, 7), z = zin[ym] = zin[ym] || {sum: 0, n: 0, last: r.date, pockets: {}};
    const v = (r.credit ? 1 : -1) * r.amount; z.sum += v; z.n++; if (r.date > z.last) z.last = r.date;
    const pk = (r.full.match(/[„"]([^“"]+)[“"]/) || [])[1] || r.section || "Konto"; z.pockets[pk] = (z.pockets[pk] || 0) + v; });
  rows = rows.filter(r => r.type !== "zinsen");
  Object.entries(zin).forEach(([ym, z]) => rows.push({id: uid(), type: "zinsen", date: z.last, name: "Zinsen (netto)", amount: Math.abs(Math.round(z.sum * 100) / 100), credit: z.sum >= 0, negative: z.sum < 0, section: "*",
    note: `${z.n} ${z.n === 1 ? "Buchung" : "Buchungen"} · ` + Object.entries(z.pockets).map(([k, v]) => `${k} ${fmt(v)}`).join(", ")}));
  pdfRows = markRecurring(rows);
  // Konten: standardmäßig nur das Girokonto bzw. das erste Konto
  const secs = [...new Set(pdfRows.filter(r => r.section !== "*").map(r => r.section))];
  pdfAccounts = {}; secs.forEach((n, i) => pdfAccounts[n] = /giro|^konto$/i.test(n) || (i === 0 && !secs.some(x => /giro/i.test(x))));
  // Vorbelegung der Haken + Abgleich mit vorhandenen Daten
  const salMonthDone = {};
  pdfRows.sort((a, b) => a.date.localeCompare(b.date)).forEach(r => {
    const ym = r.date.slice(0, 7), real = D.incomes[ym] || [];
    if (r.credit && r.type === "alltag") r.type = "sonstig";
    r.on = ["gehalt", "sonstig", "zinsen", "newfix"].includes(r.type);
    if (r.type === "gehalt"){
      const ex = real.filter(isSalary);
      if (ex.some(x => Math.abs(x.amount - r.amount) < 0.01)){ r.on = false; r.note = "schon eingetragen"; }
      else if (ex.length === 1 && !salMonthDone[ym]){ r.replace = ex[0].id; r.note = `ersetzt ${fmt(ex[0].amount)}`; }
      salMonthDone[ym] = true;
    }
    if (r.type === "zinsen"){
      const ex = real.filter(x => x.kind === "zinsen");
      const signed = r.negative ? -r.amount : r.amount;
      if (ex.some(x => Math.abs(x.amount - signed) < 0.01)){ r.on = false; r.note = "schon eingetragen"; }
      else { const old = ex.find(x => x.note === "aus Kontoauszug"); if (old){ r.replace = old.id; r.note += ` · ersetzt ${fmt(old.amount)}`; } }
    }
    if (r.type === "sonstig" && !/ebay|kleinanzeigen|vinted|momox|rebuy/i.test(r.full + " " + r.name)){ r.on = false; r.note = /karte:/i.test(r.full) ? "Erstattung? – bitte prüfen" : "bitte prüfen"; }
    if (r.type === "sonstig" && real.some(x => x.kind === "sonstig" && Math.abs(x.amount - r.amount) < 0.01 && (x.name === r.name || x.note === "aus Kontoauszug"))){ r.on = false; r.note = "schon eingetragen"; }
    if (r.type === "alltag" && D.tx.some(t => t.date === r.date && Math.abs(t.amount - r.amount) < 0.01)) r.note = "schon erfasst";
  });
  if (!pdfRows.length){
    openSheet(`<h2>Keine Buchungen gefunden</h2><p class="hint">In ${failed.length ? esc(failed.join(", ")) : "der Datei"} konnte ich keine Buchungen erkennen. Das passiert bei eingescannten Auszügen (Bild statt Text) oder ungewöhnlichen Layouts. Schick mir gern ein Beispiel mit geschwärzten Daten, dann passe ich das Einlesen an.</p><button class="btn" onclick="startPDF()">Andere Datei wählen</button>`);
    return;
  }
  if (keepEdits){ pdfRows.forEach(r => { const e = edits[pdfKey(r)]; if (e) Object.assign(r, e, {touched: true}); }); Object.keys(prevAcc).forEach(k => { if (k in pdfAccounts) pdfAccounts[k] = prevAcc[k]; }); }
  pdfFailed = failed; pdfPending = true; renderPDFReview();
}
let pdfFailed = [];
const pdfVisible = r => r.section === "*" || pdfAccounts[r.section];

  const cats = D.categories.map(c => `<option value="alltag:${c.id}" ${r.type === "alltag" && r.cat === c.id ? "selected" : ""}>🧾 Alltag · ${esc(c.name)}</option>`).join("");
  return PDF_TYPES.map(([k, l]) => `<option value="${k}" ${r.type === k ? "selected" : ""}>${l}</option>`).join("") + (r.credit ? "" : `<optgroup label="Alltagsausgabe">${cats}</optgroup>`) + `<option value="ignore" ${r.type === "ignore" ? "selected" : ""}>🚫 Ignorieren</option>`;
}

async function importPDFRows(e){
  const sel = pdfRows.filter(r => pdfVisible(r) && r.on && !["fix", "ignore"].includes(r.type));
  if (!sel.length) return;
  const cnt = {gehalt:0, zinsen:0, sonstig:0, alltag:0, newfix:0};
  const groups = {};
  for (const r of sel){
    const ym = r.date.slice(0, 7);
    if (["gehalt", "zinsen", "sonstig"].includes(r.type)){
      if (!Array.isArray(D.incomes[ym])) D.incomes[ym] = [];
      const amount = r.negative ? -r.amount : r.amount;
      const idx = r.replace ? D.incomes[ym].findIndex(x => x.id === r.replace) : -1;
      if (idx >= 0) D.incomes[ym][idx] = {...D.incomes[ym][idx], amount, note: "aus Kontoauszug"};
      else D.incomes[ym].push({id: uid(), name: r.name, amount, note: "aus Kontoauszug", kind: r.type});
      cnt[r.type]++;
    } else if (r.type === "alltag"){
      D.tx.push({id: uid(), date: r.date, name: r.name, amount: r.amount, cat: r.cat || "sonst", src: "pdf"}); learn(r.name, r.cat || "sonst"); cnt.alltag++;
    } else if (r.type === "newfix"){
      const k = r.group || r.id; (groups[k] = groups[k] || []).push(r);
    }
  }
  for (const g of Object.values(groups)){
    g.sort((a, b) => a.date.localeCompare(b.date));
    const last = g[g.length - 1], catId = guessCategory(last.name, D.rules);
    D.fixed.push({id: uid(), name: last.name, amount: last.amount, interval: "monthly", cat: catId === "essen" ? "sonst" : catId, day: +last.date.slice(8, 10), month: 1, note: "aus Kontoauszug", from: g[0].date.slice(0, 7), until: null});
    cnt.newfix++;
  }
  pdfPending = false; pdfRows = []; pdfFound = [];
  await persist(); closeSheet(); celebrate(e, 1.5);
  const parts = [cnt.gehalt && `${cnt.gehalt}× Gehalt`, cnt.sonstig && `${cnt.sonstig} Eingänge`, cnt.zinsen && `${cnt.zinsen}× Zinsen`, cnt.newfix && `${cnt.newfix} neue Fixkosten`, cnt.alltag && `${cnt.alltag} Alltag`].filter(Boolean);
  toast("📄 Übernommen: " + parts.join(" · "));
  YEAR = +sel[0].date.slice(0, 4); go("year");
}

function searchResults(){

const NOTE_VALUES = [5, 10, 20, 50, 100, 200];
function pickNote(){ const r = Math.random(); return r < .2 ? 5 : r < .4 ? 10 : r < .6 ? 20 : r < .8 ? 50 : r < .94 ? 100 : 200; }
function spawnNote(v, scale){
  const n = NOTES[v], el = document.createElement("div");
  el.className = "bill"; el.style.width = (n.w * scale).toFixed(1) + "px"; el.style.height = (n.h * scale).toFixed(1) + "px"; el.style.backgroundImage = noteSVG(v);
  document.body.appendChild(el); return {el, w: n.w * scale, h: n.h * scale};

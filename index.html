function moneyRain(e, power = 1){
  const r = (e?.target?.getBoundingClientRect?.() && e.target.isConnected) ? e.target.getBoundingClientRect() : {left: innerWidth / 2 - 40, top: innerHeight * 0.6, width: 80, height: 0};
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const burst = Math.round((reduce ? 6 : 24) * power), rain = Math.round((reduce ? 4 : 22) * power);
  const scale = Math.min(0.72, Math.max(0.55, innerWidth / 640));
  // 1) Schwall nach oben vom Knopf
  for (let i = 0; i < burst; i++){
    const {el, w, h} = spawnNote(pickNote(), scale * (0.85 + Math.random() * 0.3));
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
    const vel = (cy > innerHeight * 0.45 ? 950 + Math.random() * 450 : 550 + Math.random() * 300);
    const vx = Math.cos(ang) * vel * 0.8, vy = Math.sin(ang) * vel, g = 1500, tPeak = -vy / g;
    const dur = tPeak + 1.8 + Math.random() * 1.2, frames = [], steps = 22, spin = (Math.random() - 0.5) * 540, flip = 1.5 + Math.random() * 2.5, sway = 30 + Math.random() * 50, phase = Math.random() * 6;
    const px = cx - w / 2 + vx * tPeak, py = cy - h / 2 + vy * tPeak + 0.5 * g * tPeak * tPeak;
    for (let k = 0; k <= steps; k++){
      const tt = dur * k / steps; let x, y;
      if (tt <= tPeak){ x = cx - w / 2 + vx * tt; y = cy - h / 2 + vy * tt + 0.5 * g * tt * tt; }
      else { const f = tt - tPeak; x = px + vx * 0.15 * f + Math.sin(f * 3.2 + phase) * sway; y = py + 110 * f + 85 * f * f; }
      frames.push({transform:`translate(${x}px,${y}px) perspective(500px) rotate(${spin * tt / dur}deg) rotateX(${Math.sin(tt * flip * Math.PI) * 65}deg) rotateY(${Math.cos(tt * flip * 2) * 35}deg) scale(${0.55 + Math.min(1, tt * 4) * 0.45})`,
        opacity: k > steps * 0.86 ? (steps - k) / (steps * 0.14) : 1});
    }
    el.animate(frames, {duration: dur * 1000, easing: "linear", delay: i * 14}).onfinish = () => el.remove();
  }
  // 2) Geldregen von oben über die ganze Breite
  for (let i = 0; i < rain; i++){
    const {el, w, h} = spawnNote(pickNote(), scale * (0.75 + Math.random() * 0.4));
    const x0 = Math.random() * (innerWidth + 60) - 30 - w / 2, dur = 2.6 + Math.random() * 1.6, sway = 25 + Math.random() * 45, phase = Math.random() * 6;
    const spin0 = Math.random() * 360, spin = (Math.random() - 0.5) * 300, flip = 1 + Math.random() * 2, frames = [], steps = 20, fall = innerHeight + h + 120;
    for (let k = 0; k <= steps; k++){
      const tt = dur * k / steps, p = k / steps;
      frames.push({transform:`translate(${x0 + Math.sin(tt * 2.6 + phase) * sway}px,${-h - 40 + fall * (p * 0.75 + p * p * 0.25)}px) perspective(500px) rotate(${spin0 + spin * p}deg) rotateX(${Math.sin(tt * flip * Math.PI) * 70}deg) rotateY(${Math.cos(tt * flip * 1.7) * 40}deg)`});
    }
    el.animate(frames, {duration: dur * 1000, easing: "linear", delay: 250 + Math.random() * 900, fill: "backwards"}).onfinish = () => el.remove();
  }
}
function celebrate(e, power = 1){ kaching(); moneyRain(e, power); }

/* Ziehen zum Aktualisieren */
let ptrY = null, ptrD = 0, ptrBusy = false;
const PTR_MAX = 70;
function ptrAllowed(){ return KEY && !$("#app").classList.contains("hidden") && !$("#sheet").classList.contains("on") && window.scrollY <= 0 && !ptrBusy; }
function ptrShow(d){
  const p = Math.min(1, d / PTR_MAX);
  $("#ptr").style.opacity = p; $("#ptr").style.transform = `translateY(${Math.min(d, PTR_MAX + 20) - 50}px) scale(${0.6 + 0.4 * p}) rotate(${d * 3}deg)`;
  $("#ptrLbl").style.transform = `translateY(${Math.min(d, PTR_MAX + 20) - 50}px)`; $("#ptrLbl").style.opacity = d > 20 ? 1 : 0; $("#ptrLbl").textContent = d >= PTR_MAX ? "Loslassen zum Aktualisieren" : "Zum Aktualisieren ziehen";
  $("#app").style.transform = d ? `translateY(${Math.min(d, PTR_MAX + 20) * 0.5}px)` : "";
}
function ptrReset(){ $("#ptr").style.transition = "transform .3s, opacity .3s"; $("#app").style.transition = "transform .3s"; ptrShow(0); $("#ptrLbl").style.opacity = 0;
  setTimeout(() => { $("#ptr").style.transition = ""; $("#app").style.transition = ""; }, 320); }
window.addEventListener("touchstart", e => { if (ptrAllowed() && e.touches.length === 1) { ptrY = e.touches[0].clientY; ptrD = 0; } else ptrY = null; }, {passive:true});
window.addEventListener("touchmove", e => {
  if (ptrY === null) return;
  const dy = e.touches[0].clientY - ptrY;
  if (dy <= 0 || window.scrollY > 0){ if (ptrD) { ptrD = 0; ptrShow(0); } return; }
  ptrD = dy * 0.5; ptrShow(ptrD);
  if (e.cancelable) e.preventDefault();
}, {passive:false});
window.addEventListener("touchend", () => { if (ptrY === null) return; ptrY = null; if (ptrD >= PTR_MAX) refreshNow(); else ptrReset(); ptrD = 0; });
async function refreshNow(){
  ptrBusy = true; $("#ptr").classList.add("spin"); $("#ptrLbl").textContent = "Aktualisiere …"; $("#ptrLbl").style.opacity = 1;
  $("#ptr").style.transition = "transform .25s"; $("#ptr").style.transform = "translateY(20px) scale(1)"; $("#ptrLbl").style.transform = "translateY(20px)"; $("#app").style.transition = "transform .25s"; $("#app").style.transform = "translateY(30px)";
  const started = Date.now();
  let newVersion = null;
  try{
    const html = await fetch("index.html?ts=" + Date.now(), {cache:"no-store"}).then(r => r.ok ? r.text() : "");
    const m = html.match(/const APP_VERSION = "([\d.]+)"/); if (m && m[1] !== APP_VERSION) newVersion = m[1];
  }catch{}
  if (D?.settings?.sync) await pullSync(false, true);
  await new Promise(r => setTimeout(r, Math.max(0, 700 - (Date.now() - started))));
  $("#ptr").classList.remove("spin"); ptrBusy = false; ptrReset();
  if (newVersion){
    toast(`✨ Version ${newVersion} wird geladen …`);
    try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch {}
    setTimeout(() => location.reload(), 900); return;
  }
  render(); toast(D?.settings?.sync ? "🔄 Aktualisiert · " + syncState.msg : "🔄 Aktualisiert");
}
